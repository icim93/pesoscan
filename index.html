<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101826">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PesoScan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<title>PesoScan</title>
<style>
  :root{
    --ink:#101826;
    --ink-2:#182236;
    --panel:#1B2436;
    --line:#2B3650;
    --paper:#EDEBE3;
    --muted:#8B94A8;
    --gold:#E3B23C;
    --gold-dim:#7A5F27;
    --curd:#4C8C6B;
    --danger:#C4574A;
    --mono: ui-monospace, 'SF Mono', 'Roboto Mono', Menlo, Consolas, monospace;
    --sans: -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--ink);color:var(--paper);font-family:var(--sans);}
  body{
    display:flex; flex-direction:column;
    min-height:100dvh;
    overscroll-behavior:none;
  }
  header{
    padding:14px 18px 10px;
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  header h1{
    font-size:15px; letter-spacing:.14em; text-transform:uppercase;
    font-weight:700; margin:0; color:var(--gold);
  }
  header .sub{font-size:11px; color:var(--muted);}
  .hdr-actions{display:flex; align-items:center; gap:8px;}
  #btnInstall{
    background:none;border:1px solid var(--line);color:var(--gold);
    border-radius:8px;font-size:11px;letter-spacing:.04em;padding:0 10px;height:32px;
  }
  #gear{
    background:none;border:1px solid var(--line);color:var(--muted);
    width:32px;height:32px;border-radius:8px;font-size:16px;line-height:1;
  }

  /* --- Scale readout, the signature element --- */
  .readout{
    margin:14px 18px 8px;
    background: linear-gradient(180deg, #0C1220, #0A0F1A);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 18px 14px;
    position:relative;
    box-shadow: inset 0 0 22px rgba(0,0,0,.55);
  }
  .readout .label{
    font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted);
  }
  .readout .value{
    font-family:var(--mono);
    font-variant-numeric: tabular-nums;
    font-size:44px; font-weight:600; color:var(--gold);
    text-shadow: 0 0 18px rgba(227,178,60,.35);
    line-height:1.1;
  }
  .readout .value small{font-size:20px; color:var(--gold-dim); font-weight:600;}
  .readout .count{font-size:12px; color:var(--muted); margin-top:2px;}
  .flash{
    position:absolute; right:18px; top:16px;
    font-family:var(--mono); font-size:14px; color:var(--curd);
    opacity:0; transform:translateY(0px);
  }
  .flash.show{ animation: floatUp 1.1s ease-out forwards; }
  @keyframes floatUp{
    0%{opacity:0; transform:translateY(6px);}
    15%{opacity:1; transform:translateY(0px);}
    75%{opacity:1;}
    100%{opacity:0; transform:translateY(-14px);}
  }

  /* --- camera viewport --- */
  .cam-wrap{
    margin:6px 18px 10px;
    border-radius:14px;
    overflow:hidden;
    background:#000;
    border:1px solid var(--line);
    position:relative;
    aspect-ratio: 4/3;
  }
  video{width:100%;height:100%;object-fit:cover;display:block;}
  .cam-frame{
    position:absolute; inset:14%;
    border:2px solid rgba(227,178,60,.75);
    border-radius:10px;
    pointer-events:none;
  }
  .cam-status{
    position:absolute; left:0; right:0; bottom:0;
    padding:8px 10px; font-size:11px; text-align:center;
    background:linear-gradient(0deg, rgba(0,0,0,.65), transparent);
    color:var(--paper); font-family:var(--mono);
  }
  #qrReaderFallback{position:absolute; inset:0; display:none; background:#000;}
  #qrReaderFallback video, #qrReaderFallback canvas{
    width:100% !important; height:100% !important; object-fit:cover;
  }
  #qrReaderFallback img{display:none;}
  .cam-off{
    display:flex; align-items:center; justify-content:center;
    height:100%; color:var(--muted); font-size:13px; text-align:center; padding:20px;
  }
  .candidate-badge{
    position:absolute; left:0; right:0; top:10px;
    display:flex; justify-content:center; pointer-events:none;
  }
  .candidate-badge span{
    background:rgba(10,14,22,.82); border:1px solid rgba(227,178,60,.55);
    color:var(--gold); font-family:var(--mono); font-size:12.5px;
    padding:5px 12px; border-radius:999px; opacity:0; transition:opacity .15s ease;
  }
  .candidate-badge span.on{opacity:1;}
  .candidate-badge span.invalid{border-color:rgba(196,87,74,.65); color:var(--danger);}
  .shutter-wrap{
    position:absolute; left:0; right:0; bottom:34px;
    display:flex; justify-content:center; pointer-events:none;
  }
  #btnCapture{
    pointer-events:auto;
    width:66px; height:66px; border-radius:50%;
    background:var(--gold); border:4px solid rgba(255,255,255,.85);
    box-shadow:0 3px 14px rgba(0,0,0,.5);
    font-size:0;
  }
  #btnCapture:active{ transform:scale(.93); }
  #btnCapture.disabled{ background:var(--muted); pointer-events:none; opacity:.6; }

  .manual{
    margin:0 18px 8px; display:flex; gap:8px;
  }
  .manual input{
    flex:1; background:var(--panel); border:1px solid var(--line); color:var(--paper);
    border-radius:10px; padding:10px 12px; font-family:var(--mono); font-size:14px;
  }
  .manual button{
    background:var(--gold); border:none; color:#1B1502; font-weight:700;
    border-radius:10px; padding:0 16px; font-size:13px;
  }

  main{flex:1; overflow-y:auto; padding:4px 18px 12px;}
  .list-title{
    font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
    margin:10px 2px 6px; display:flex; align-items:center; justify-content:space-between;
  }
  #btnExport{
    background:none; border:1px solid var(--line); color:var(--gold);
    font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
    padding:4px 9px; border-radius:6px;
  }
  ul#log{list-style:none; margin:0; padding:0;}
  ul#log li{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:10px 12px; margin-bottom:7px;
  }
  ul#log li .code{font-family:var(--mono); font-size:12.5px; color:var(--muted);}
  ul#log li .w{font-family:var(--mono); font-size:15px; font-weight:600; color:var(--paper);}
  ul#log li button{
    background:none; border:none; color:var(--danger); font-size:18px; padding:0 4px;
  }
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:24px 10px;}

  footer{
    display:flex; flex-wrap:wrap; gap:10px; padding:12px 18px 18px;
    border-top:1px solid var(--line);
  }
  footer button{
    flex:1; min-width:100px; padding:13px 0; border-radius:12px; border:none; font-weight:700; font-size:14px;
  }
  #btnScan{background:var(--curd); color:#08150F;}
  #btnScan.active{background:var(--danger); color:#1A0705;}
  #btnUndo{background:var(--panel); color:var(--paper); border:1px solid var(--line);}
  #btnReset{background:var(--panel); color:var(--danger); border:1px solid var(--line);}

  /* settings modal */
  dialog{
    border:none; border-radius:14px; padding:0; width:min(340px, 92vw);
    background:var(--panel); color:var(--paper); font-family:var(--sans);
    max-height:85vh; overflow-y:auto;
  }
  dialog::backdrop{background:rgba(0,0,0,.55);}
  .dlg-body{padding:18px;}
  .dlg-body h2{font-size:14px; letter-spacing:.08em; text-transform:uppercase; color:var(--gold); margin:0 0 14px;}
  .dlg-body h3{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:18px 0 10px; border-top:1px solid var(--line); padding-top:14px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:11px; color:var(--muted); margin-bottom:4px;}
  .field input{
    width:100%; background:var(--ink-2); border:1px solid var(--line); color:var(--paper);
    border-radius:8px; padding:8px 10px; font-family:var(--mono); font-size:13px;
  }
  .field.checkbox-field label{
    display:flex; align-items:center; gap:8px; font-size:12px; color:var(--paper);
  }
  .field.checkbox-field input{width:16px; height:16px; flex:none;}
  .field.pair{display:flex; gap:8px;}
  .field.pair > div{flex:1;}
  .dlg-actions{display:flex; gap:8px; margin-top:16px;}
  .dlg-actions button{flex:1; padding:10px; border-radius:9px; border:none; font-weight:700;}
  .dlg-actions .save{background:var(--gold); color:#1B1502;}
  .dlg-actions .cancel{background:var(--ink-2); color:var(--paper); border:1px solid var(--line);}
</style>
</head>
<body>

<header>
  <div>
    <h1>PesoScan</h1>
    <div class="sub">somma pesi da codici EAN</div>
  </div>
  <div class="hdr-actions">
    <button id="btnInstall" title="Installa app" style="display:none;">Installa</button>
    <button id="gear" title="Impostazioni">&#9881;</button>
  </div>
</header>

<div class="readout">
  <div class="label">Totale</div>
  <div class="value" id="total">0<small>,000 kg</small></div>
  <div class="count" id="countLabel">0 letture</div>
  <div class="flash" id="flash"></div>
</div>

<div class="cam-wrap">
  <video id="video" playsinline muted></video>
  <div id="qrReaderFallback"></div>
  <div class="cam-frame" id="camFrame" style="display:none;"></div>
  <div class="candidate-badge"><span id="candidateBadge"></span></div>
  <div class="shutter-wrap" id="shutterWrap" style="display:none;">
    <button id="btnCapture" title="Cattura">Cattura</button>
  </div>
  <div class="cam-status" id="camStatus"></div>
  <div class="cam-off" id="camOff">Fotocamera non avviata.<br>Tocca "Avvia scansione" qui sotto.</div>
</div>

<div class="manual">
  <input id="manualInput" inputmode="numeric" placeholder="Inserisci codice EAN manualmente">
  <button id="manualAdd">Aggiungi</button>
</div>

<main>
  <div class="list-title"><span>Letture <span id="listCount">0</span></span><button id="btnExport" title="Esporta CSV">Esporta CSV</button></div>
  <ul id="log"></ul>
  <div class="empty" id="emptyMsg">Nessuna lettura ancora.</div>
</main>

<footer>
  <button id="btnScan">Avvia scansione</button>
  <button id="btnUndo">Annulla ultima</button>
  <button id="btnReset">Azzera</button>
</footer>

<dialog id="settingsDlg">
  <div class="dlg-body">
    <h2>Impostazioni formato EAN</h2>
    <div class="field">
      <label>Posizione iniziale campo peso (1-based)</label>
      <input type="number" id="cfgStart" min="1" max="13">
    </div>
    <div class="field">
      <label>Lunghezza campo peso (cifre)</label>
      <input type="number" id="cfgLen" min="1" max="8">
    </div>
    <div class="field">
      <label>Divisore (grammi per unità, es. 1000 = kg)</label>
      <input type="number" id="cfgDiv" min="1">
    </div>
    <div class="field">
      <label>Blocco tra due catture consecutive (ms)</label>
      <input type="number" id="cfgCooldown" min="0" step="100">
    </div>

    <h3>Prefisso peso variabile</h3>
    <div class="field checkbox-field">
      <label><input type="checkbox" id="cfgPrefixOn"> Applica filtro prefisso</label>
    </div>
    <div class="field pair">
      <div>
        <label>Prefisso minimo</label>
        <input type="number" id="cfgPrefixMin" min="0" max="99">
      </div>
      <div>
        <label>Prefisso massimo</label>
        <input type="number" id="cfgPrefixMax" min="0" max="99">
      </div>
    </div>

    <div class="dlg-actions">
      <button class="cancel" id="cfgCancel">Annulla</button>
      <button class="save" id="cfgSave">Salva</button>
    </div>
  </div>
</dialog>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "pesoscan_state_v1";
  var CFG_KEY = "pesoscan_cfg_v1";
  var DUPLICATE_WINDOW_MS = 10000;
  var STABILITY_COUNT = 2;
  var GS1_GS = "\x1D"; // GS1-128 group separator (FNC1), used to terminate variable-length AIs

  var defaultCfg = { start: 8, len: 5, div: 1000, cooldown: 500, prefixOn: true, prefixMin: 20, prefixMax: 29 };
  var cfg = loadCfg();
  var state = loadState(); // { items: [{code, weightG, ts}], lastCodeTs: {code: ts} }

  var totalEl = document.getElementById('total');
  var countLabel = document.getElementById('countLabel');
  var listCount = document.getElementById('listCount');
  var logEl = document.getElementById('log');
  var emptyMsg = document.getElementById('emptyMsg');
  var flashEl = document.getElementById('flash');
  var video = document.getElementById('video');
  var camFrame = document.getElementById('camFrame');
  var camStatus = document.getElementById('camStatus');
  var camOff = document.getElementById('camOff');
  var btnScan = document.getElementById('btnScan');
  var btnUndo = document.getElementById('btnUndo');
  var btnReset = document.getElementById('btnReset');
  var btnExport = document.getElementById('btnExport');
  var btnInstall = document.getElementById('btnInstall');
  var manualInput = document.getElementById('manualInput');
  var manualAdd = document.getElementById('manualAdd');
  var gear = document.getElementById('gear');
  var dlg = document.getElementById('settingsDlg');
  var candidateBadge = document.getElementById('candidateBadge');
  var shutterWrap = document.getElementById('shutterWrap');
  var btnCapture = document.getElementById('btnCapture');

  var stream = null;
  var detector = null;
  var scanning = false;
  var rafId = null;
  var cropCanvas = document.createElement('canvas');
  var cropCtx = cropCanvas.getContext('2d', { willReadFrequently: true });
  var candidate = null; // { code, ts }
  var stableCandidate = null; // { code, count }
  var lastCaptureTs = 0;
  var usingFallback = false;
  var html5QrcodeInstance = null;
  var html5QrcodeLibPromise = null;

  function loadHtml5QrcodeLib(){
    if(window.Html5Qrcode) return Promise.resolve();
    if(html5QrcodeLibPromise) return html5QrcodeLibPromise;
    html5QrcodeLibPromise = new Promise(function(resolve, reject){
      var s = document.createElement('script');
      s.src = 'vendor/html5-qrcode.min.js';
      s.onload = function(){ resolve(); };
      s.onerror = function(){ reject(new Error('load-failed')); };
      document.head.appendChild(s);
    });
    return html5QrcodeLibPromise;
  }

  function loadCfg(){
    try{
      var raw = localStorage.getItem(CFG_KEY);
      if(raw) return Object.assign({}, defaultCfg, JSON.parse(raw));
    }catch(e){}
    return Object.assign({}, defaultCfg);
  }
  function saveCfg(){
    try{ localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }catch(e){}
  }
  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(!parsed.items) parsed.items = [];
        if(!parsed.lastCodeTs) parsed.lastCodeTs = {};
        parsed.items.forEach(function(it){
          if(typeof it.weightG !== 'number'){
            it.weightG = Math.round((it.weightKg||0)*1000);
          }
          delete it.weightKg;
        });
        return parsed;
      }
    }catch(e){}
    return { items: [], lastCodeTs: {} };
  }
  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  function fmtKg(n){
    return n.toLocaleString('it-IT', {minimumFractionDigits:3, maximumFractionDigits:3});
  }

  function render(){
    var totalG = state.items.reduce(function(s,it){return s+it.weightG;},0);
    var parts = fmtKg(totalG/1000).split(',');
    totalEl.innerHTML = parts[0] + '<small>,' + parts[1] + ' kg</small>';
    countLabel.textContent = state.items.length + (state.items.length===1?' lettura':' letture');
    listCount.textContent = state.items.length;

    logEl.innerHTML = '';
    if(state.items.length===0){
      emptyMsg.style.display = 'block';
    } else {
      emptyMsg.style.display = 'none';
      // most recent first
      for(var i=state.items.length-1;i>=0;i--){
        (function(it, idx){
          var li = document.createElement('li');
          var left = document.createElement('div');
          left.innerHTML = '<div class="w">' + fmtKg(it.weightG/1000) + ' kg</div><div class="code">' + it.code + '</div>';
          var del = document.createElement('button');
          del.textContent = '×';
          del.onclick = function(){
            state.items.splice(idx,1);
            saveState();
            render();
          };
          li.appendChild(left);
          li.appendChild(del);
          logEl.appendChild(li);
        })(state.items[i], i);
      }
    }
  }

  function flashAdd(weightKg){
    flashEl.textContent = '+' + fmtKg(weightKg) + ' kg';
    flashEl.classList.remove('show');
    void flashEl.offsetWidth; // reflow to restart animation
    flashEl.classList.add('show');
  }

  // ---- GTIN (EAN/UPC) check digit ----
  function gtinCheckDigit(dataDigits){
    var sum = 0;
    for(var i=0;i<dataDigits.length;i++){
      var d = dataDigits.charCodeAt(dataDigits.length-1-i) - 48;
      sum += (i % 2 === 0 ? 3 : 1) * d;
    }
    return (10 - (sum % 10)) % 10;
  }
  function isValidGtin(code){
    var data = code.slice(0, -1);
    var check = code.charCodeAt(code.length-1) - 48;
    return gtinCheckDigit(data) === check;
  }

  // ---- classic fixed-position EAN weight parsing ----
  function evaluateEanWeight(code){
    if(!/^(\d{8}|\d{12}|\d{13}|\d{14})$/.test(code)) return { ok:false };
    if(!isValidGtin(code)) return { ok:false, reason:'checksum' };
    if(cfg.prefixOn){
      var prefix = parseInt(code.slice(0,2),10);
      if(prefix < cfg.prefixMin || prefix > cfg.prefixMax) return { ok:false, reason:'prefix' };
    }
    var start = cfg.start - 1;
    var len = cfg.len;
    if(start < 0 || start + len > code.length) return { ok:false, reason:'format' };
    var digits = code.substring(start, start+len);
    var grams = parseInt(digits, 10);
    if(isNaN(grams) || grams <= 0) return { ok:false, reason:'format' };
    return { ok:true, weightKg: grams / cfg.div };
  }

  // ---- targeted GS1-128 parser: AI(01) GTIN, AI(10) lot, AI(15/17) dates, AI(3100-3105) net weight kg ----
  var GS1_AI_TABLE = {
    '01':   { len:14, type:'gtin' },
    '10':   { len:-1, type:'lot' },
    '15':   { len:6,  type:'date' },
    '17':   { len:6,  type:'date' },
    '21':   { len:-1, type:'serial' },
    '3100': { len:6, type:'weight', decimals:0 },
    '3101': { len:6, type:'weight', decimals:1 },
    '3102': { len:6, type:'weight', decimals:2 },
    '3103': { len:6, type:'weight', decimals:3 },
    '3104': { len:6, type:'weight', decimals:4 },
    '3105': { len:6, type:'weight', decimals:5 }
  };
  function parseGS1_128(raw){
    var s = String(raw);
    var i = 0;
    var result = { gtin: null, weightKg: null };
    var recognizedAny = false;
    while(i < s.length){
      if(s[i] === GS1_GS){ i++; continue; }
      var ai4 = s.substr(i,4);
      var ai2 = s.substr(i,2);
      var aiCode, aiDef;
      if(GS1_AI_TABLE[ai4]){ aiCode = ai4; aiDef = GS1_AI_TABLE[ai4]; }
      else if(GS1_AI_TABLE[ai2]){ aiCode = ai2; aiDef = GS1_AI_TABLE[ai2]; }
      else break; // unrecognized AI: targeted parser stops rather than guessing
      i += aiCode.length;
      if(aiDef.len === -1){
        var end = s.indexOf(GS1_GS, i);
        if(end === -1) end = s.length;
        i = end;
      } else {
        var val = s.substr(i, aiDef.len);
        if(val.length < aiDef.len) break; // truncated read
        i += aiDef.len;
        recognizedAny = true;
        if(aiDef.type === 'gtin'){
          if(!isValidGtin(val)) return null;
          result.gtin = val;
        } else if(aiDef.type === 'weight'){
          var n = parseInt(val,10);
          if(!isNaN(n)) result.weightKg = n / Math.pow(10, aiDef.decimals);
        }
      }
    }
    if(!recognizedAny || result.weightKg === null || result.weightKg <= 0) return null;
    return result;
  }

  function evaluateCode(rawCode){
    var code = String(rawCode).trim();
    if(/^(\d{8}|\d{12}|\d{13}|\d{14})$/.test(code)){
      return evaluateEanWeight(code);
    }
    if(code.length > 14){
      var gs1 = parseGS1_128(code);
      if(gs1) return { ok:true, weightKg: gs1.weightKg, gtin: gs1.gtin };
      return { ok:false, reason:'gs1' };
    }
    return { ok:false, reason:'format' };
  }

  function statusMessageFor(code, reason){
    if(reason === 'checksum') return 'Cifra di controllo non valida: ' + code;
    if(reason === 'prefix') return 'Prefisso non ammesso: ' + code;
    if(reason === 'gs1') return 'Codice GS1-128 non riconosciuto: ' + code;
    return 'Codice non valido: ' + code;
  }

  // A misread can still pass the GTIN checksum by chance (~1 in 10). When it
  // does, the wrong code usually differs from the correct one by only a
  // couple of digits, so we also flag same-length codes that are very close
  // to one just added, not only exact repeats.
  var SIMILAR_MAX_DISTANCE = 2;
  function hammingDistance(a, b){
    if(a.length !== b.length) return Infinity;
    var d = 0;
    for(var i=0;i<a.length;i++){ if(a[i] !== b[i]) d++; }
    return d;
  }
  function findRecentSimilarCode(code, now){
    for(var i=state.items.length-1;i>=0;i--){
      var it = state.items[i];
      if(now - it.ts > DUPLICATE_WINDOW_MS) break; // items are chronological; older ones can't be in the window either
      if(it.code === code) continue;
      var dist = hammingDistance(code, it.code);
      if(dist > 0 && dist <= SIMILAR_MAX_DISTANCE) return it.code;
    }
    return null;
  }

  function tryAddCode(code){
    code = String(code).trim();
    var now = Date.now();
    var res = evaluateCode(code);
    if(!res.ok){
      camStatus.textContent = statusMessageFor(code, res.reason);
      return false;
    }
    var last = state.lastCodeTs[code];
    var isExactDup = last && (now - last) < DUPLICATE_WINDOW_MS;
    var similarCode = isExactDup ? null : findRecentSimilarCode(code, now);
    if(isExactDup || similarCode){
      var msg = isExactDup
        ? 'Codice già letto pochi secondi fa. Aggiungere comunque?'
        : 'Codice simile a una lettura recente (' + similarCode + '): potrebbe essere un errore di lettura. Aggiungere comunque?';
      if(!confirm(msg)){
        camStatus.textContent = 'Lettura annullata (' + (isExactDup ? 'duplicato' : 'codice simile') + '): ' + code;
        return false;
      }
    }
    var weightG = Math.round(res.weightKg * 1000);
    state.items.push({ code: code, weightG: weightG, ts: now });
    state.lastCodeTs[code] = now;
    saveState();
    render();
    flashAdd(weightG/1000);
    if(navigator.vibrate) navigator.vibrate(60);
    camStatus.textContent = 'Aggiunto ' + fmtKg(weightG/1000) + ' kg  •  ' + code;
    return true;
  }

  // ---- CSV export ----
  function exportCsv(){
    if(state.items.length === 0){
      camStatus.textContent = 'Nessuna lettura da esportare.';
      return;
    }
    function csvCell(v){
      v = String(v);
      if(v.indexOf(';')>=0 || v.indexOf('"')>=0 || v.indexOf('\n')>=0){
        v = '"' + v.replace(/"/g,'""') + '"';
      }
      return v;
    }
    var rows = [['Codice','Peso_kg','Data_ora']];
    state.items.forEach(function(it){
      rows.push([it.code, fmtKg(it.weightG/1000), new Date(it.ts).toLocaleString('it-IT')]);
    });
    var csv = rows.map(function(r){ return r.map(csvCell).join(';'); }).join('\r\n');
    var blob = new Blob(['﻿' + csv], { type:'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var pad = function(n){ return (n<10?'0':'')+n; };
    var now = new Date();
    var fname = 'pesoscan_' + now.getFullYear() + pad(now.getMonth()+1) + pad(now.getDate()) + '_' + pad(now.getHours()) + pad(now.getMinutes()) + '.csv';
    var a = document.createElement('a');
    a.href = url; a.download = fname;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  btnExport.addEventListener('click', exportCsv);

  // ---- camera / detection ----
  function supportsDetector(){
    return 'BarcodeDetector' in window;
  }

  async function startScan(){
    if(supportsDetector()){
      await startScanNative();
    } else {
      await startScanFallback();
    }
  }

  function stopScan(){
    if(usingFallback) stopScanFallback(); else stopScanNative();
  }

  function pickBestCode(rawList){
    for(var i=0;i<rawList.length;i++){
      if(evaluateCode(rawList[i]).ok) return rawList[i];
    }
    return rawList.length ? rawList[0] : null;
  }

  function handleCandidate(rawCode){
    candidate = { code: rawCode, ts: Date.now() };
    var res = evaluateCode(rawCode);
    candidateBadge.textContent = rawCode + (res.ok ? ('  → ' + fmtKg(res.weightKg) + ' kg') : '  (non valido)');
    candidateBadge.classList.add('on');
    candidateBadge.classList.toggle('invalid', !res.ok);

    if(!res.ok){
      stableCandidate = null;
      return;
    }
    if(stableCandidate && stableCandidate.code === rawCode){
      stableCandidate.count++;
    } else {
      stableCandidate = { code: rawCode, count: 1 };
    }
    if(stableCandidate.count >= STABILITY_COUNT){
      stableCandidate = null;
      var now = Date.now();
      if(now - lastCaptureTs >= cfg.cooldown){
        lastCaptureTs = now;
        var added = tryAddCode(rawCode);
        if(added){
          btnCapture.classList.add('disabled');
          setTimeout(function(){ btnCapture.classList.remove('disabled'); }, Math.max(250, cfg.cooldown));
        }
      }
    }
  }

  function handleCandidateMiss(){
    if(candidate && (Date.now() - candidate.ts) > 500){
      candidateBadge.classList.remove('on');
    }
    stableCandidate = null;
  }

  async function startScanNative(){
    try{
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width:{ideal:1920}, height:{ideal:1440} },
        audio: false
      });
    }catch(err){
      camStatus.textContent = 'Impossibile accedere alla fotocamera (' + err.message + '). Serve HTTPS o localhost.';
      return;
    }
    video.srcObject = stream;
    await video.play();
    camOff.style.display = 'none';
    camFrame.style.display = 'block';
    shutterWrap.style.display = 'flex';
    detector = new BarcodeDetector({ formats: ['ean_13','ean_8','upc_a','upc_e','code_128'] });
    scanning = true;
    btnScan.textContent = 'Ferma scansione';
    btnScan.classList.add('active');
    camStatus.textContent = 'Inquadra il codice: viene aggiunto da solo quando la lettura è stabile';
    loop();
  }

  function stopScanNative(){
    scanning = false;
    if(rafId) cancelAnimationFrame(rafId);
    if(stream){ stream.getTracks().forEach(function(t){t.stop();}); stream = null; }
    video.srcObject = null;
    camOff.style.display = 'flex';
    camFrame.style.display = 'none';
    shutterWrap.style.display = 'none';
    btnScan.textContent = 'Avvia scansione';
    btnScan.classList.remove('active');
    camStatus.textContent = '';
    candidate = null;
    stableCandidate = null;
    candidateBadge.classList.remove('on');
  }

  // ---- fallback path for browsers without BarcodeDetector (notably iOS Safari) ----
  async function startScanFallback(){
    camStatus.textContent = 'Caricamento modulo di scansione…';
    try{
      await loadHtml5QrcodeLib();
    }catch(e){
      camStatus.textContent = 'Impossibile caricare il modulo di scansione.';
      return;
    }
    var fallbackEl = document.getElementById('qrReaderFallback');
    video.style.display = 'none';
    fallbackEl.style.display = 'block';
    camOff.style.display = 'none';
    camFrame.style.display = 'block';
    shutterWrap.style.display = 'flex';

    var formats = [
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODE_128
    ];
    html5QrcodeInstance = new Html5Qrcode('qrReaderFallback', { formatsToSupport: formats, verbose:false });

    function onDetected(decodedText){ handleCandidate(decodedText); }
    function onScanError(){ handleCandidateMiss(); }

    try{
      await html5QrcodeInstance.start(
        { facingMode: 'environment' },
        { fps: 10 },
        onDetected,
        onScanError
      );
      usingFallback = true;
      scanning = true;
      btnScan.textContent = 'Ferma scansione';
      btnScan.classList.add('active');
      camStatus.textContent = 'Inquadra il codice: viene aggiunto da solo quando la lettura è stabile';
    }catch(err){
      camStatus.textContent = 'Impossibile accedere alla fotocamera su questo browser.';
      video.style.display = 'block';
      fallbackEl.style.display = 'none';
      camOff.style.display = 'flex';
      camFrame.style.display = 'none';
      shutterWrap.style.display = 'none';
    }
  }

  function stopScanFallback(){
    scanning = false;
    usingFallback = false;
    camFrame.style.display = 'none';
    shutterWrap.style.display = 'none';
    candidate = null;
    stableCandidate = null;
    candidateBadge.classList.remove('on');
    camStatus.textContent = '';
    var fallbackEl = document.getElementById('qrReaderFallback');
    if(html5QrcodeInstance){
      html5QrcodeInstance.stop().then(function(){
        html5QrcodeInstance.clear();
        html5QrcodeInstance = null;
      }).catch(function(){ html5QrcodeInstance = null; });
    }
    fallbackEl.style.display = 'none';
    video.style.display = 'block';
    camOff.style.display = 'flex';
    btnScan.textContent = 'Avvia scansione';
    btnScan.classList.remove('active');
  }

  // The visual guide box insets the video by 14% on every side (see .cam-frame).
  // The actual detection crop uses a smaller inset than the visible guide, so
  // a barcode framed right at the guide's edge still keeps its quiet-zone
  // margin in the analyzed image instead of being clipped (clipping the quiet
  // zone is a common cause of misread edge digits).
  var GUIDE_INSET = 0.14;
  var DETECT_INSET = 0.07;

  function cropToGuide(){
    var vw = video.videoWidth, vh = video.videoHeight;
    if(!vw || !vh) return null;
    var x = Math.round(vw * DETECT_INSET);
    var y = Math.round(vh * DETECT_INSET);
    var w = Math.round(vw * (1 - 2*DETECT_INSET));
    var h = Math.round(vh * (1 - 2*DETECT_INSET));
    cropCanvas.width = w;
    cropCanvas.height = h;
    cropCtx.drawImage(video, x, y, w, h, 0, 0, w, h);
    return cropCanvas;
  }

  var busy = false;
  async function loop(){
    if(!scanning) return;
    if(!busy && video.readyState >= 2){
      busy = true;
      try{
        var frame = cropToGuide();
        if(frame){
          var codes = await detector.detect(frame);
          if(codes && codes.length){
            var chosen = pickBestCode(codes.map(function(c){return c.rawValue;}));
            if(chosen) handleCandidate(chosen);
          } else {
            handleCandidateMiss();
          }
        }
      }catch(e){ /* ignore transient detection errors */ }
      busy = false;
    }
    rafId = requestAnimationFrame(loop);
  }

  btnScan.addEventListener('click', function(){
    if(scanning) stopScan(); else startScan();
  });

  btnCapture.addEventListener('click', function(){
    var now = Date.now();
    if(now - lastCaptureTs < cfg.cooldown) return;
    if(!candidate || (now - candidate.ts) > 900){
      camStatus.textContent = 'Nessun codice nel riquadro: avvicina o centra meglio.';
      return;
    }
    lastCaptureTs = now;
    var added = tryAddCode(candidate.code);
    if(added){
      stableCandidate = null;
      btnCapture.classList.add('disabled');
      setTimeout(function(){ btnCapture.classList.remove('disabled'); }, Math.max(250, cfg.cooldown));
    }
  });

  btnUndo.addEventListener('click', function(){
    if(state.items.length===0) return;
    state.items.pop();
    saveState();
    render();
  });

  btnReset.addEventListener('click', function(){
    if(state.items.length===0) return;
    if(confirm('Azzerare tutte le letture e il totale?')){
      state.items = [];
      saveState();
      render();
    }
  });

  manualAdd.addEventListener('click', function(){
    var v = manualInput.value.trim();
    if(!v) return;
    tryAddCode(v);
    manualInput.value = '';
    manualInput.focus();
  });
  manualInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter') manualAdd.click();
  });

  gear.addEventListener('click', function(){
    document.getElementById('cfgStart').value = cfg.start;
    document.getElementById('cfgLen').value = cfg.len;
    document.getElementById('cfgDiv').value = cfg.div;
    document.getElementById('cfgCooldown').value = cfg.cooldown;
    document.getElementById('cfgPrefixOn').checked = cfg.prefixOn;
    document.getElementById('cfgPrefixMin').value = cfg.prefixMin;
    document.getElementById('cfgPrefixMax').value = cfg.prefixMax;
    dlg.showModal();
  });
  document.getElementById('cfgCancel').addEventListener('click', function(){ dlg.close(); });
  document.getElementById('cfgSave').addEventListener('click', function(){
    cfg.start = parseInt(document.getElementById('cfgStart').value,10) || defaultCfg.start;
    cfg.len = parseInt(document.getElementById('cfgLen').value,10) || defaultCfg.len;
    cfg.div = parseInt(document.getElementById('cfgDiv').value,10) || defaultCfg.div;
    cfg.cooldown = parseInt(document.getElementById('cfgCooldown').value,10);
    if(isNaN(cfg.cooldown)) cfg.cooldown = defaultCfg.cooldown;
    cfg.prefixOn = document.getElementById('cfgPrefixOn').checked;
    var pMin = parseInt(document.getElementById('cfgPrefixMin').value,10);
    var pMax = parseInt(document.getElementById('cfgPrefixMax').value,10);
    if(isNaN(pMin)) pMin = defaultCfg.prefixMin;
    if(isNaN(pMax)) pMax = defaultCfg.prefixMax;
    cfg.prefixMin = Math.min(pMin, pMax);
    cfg.prefixMax = Math.max(pMin, pMax);
    saveCfg();
    dlg.close();
  });

  // ---- PWA install prompt ----
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    window.__deferredInstallPrompt = e;
    btnInstall.style.display = 'inline-block';
  });
  btnInstall.addEventListener('click', function(){
    var promptEvent = window.__deferredInstallPrompt;
    if(!promptEvent) return;
    promptEvent.prompt();
    promptEvent.userChoice.finally(function(){
      window.__deferredInstallPrompt = null;
      btnInstall.style.display = 'none';
    });
  });
  window.addEventListener('appinstalled', function(){
    btnInstall.style.display = 'none';
  });
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }

  render();
})();
</script>
</body>
</html>
