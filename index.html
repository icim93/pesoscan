<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PesoScan</title>
<style>
  :root{
    --ink:#101826;
    --ink-2:#182236;
    --panel:#1B2436;
    --line:#2B3650;
    --paper:#EDEBE3;
    --muted:#8B94A8;
    --gold:#E3B23C;
    --gold-dim:#7A5F27;
    --curd:#4C8C6B;
    --danger:#C4574A;
    --mono: ui-monospace, 'SF Mono', 'Roboto Mono', Menlo, Consolas, monospace;
    --sans: -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--ink);color:var(--paper);font-family:var(--sans);}
  body{
    display:flex; flex-direction:column;
    min-height:100dvh;
    overscroll-behavior:none;
  }
  header{
    padding:14px 18px 10px;
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  header h1{
    font-size:15px; letter-spacing:.14em; text-transform:uppercase;
    font-weight:700; margin:0; color:var(--gold);
  }
  header .sub{font-size:11px; color:var(--muted);}
  #gear{
    background:none;border:1px solid var(--line);color:var(--muted);
    width:32px;height:32px;border-radius:8px;font-size:16px;line-height:1;
  }

  /* --- Scale readout, the signature element --- */
  .readout{
    margin:14px 18px 8px;
    background: linear-gradient(180deg, #0C1220, #0A0F1A);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 18px 14px;
    position:relative;
    box-shadow: inset 0 0 22px rgba(0,0,0,.55);
  }
  .readout .label{
    font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted);
  }
  .readout .value{
    font-family:var(--mono);
    font-variant-numeric: tabular-nums;
    font-size:44px; font-weight:600; color:var(--gold);
    text-shadow: 0 0 18px rgba(227,178,60,.35);
    line-height:1.1;
  }
  .readout .value small{font-size:20px; color:var(--gold-dim); font-weight:600;}
  .readout .count{font-size:12px; color:var(--muted); margin-top:2px;}
  .flash{
    position:absolute; right:18px; top:16px;
    font-family:var(--mono); font-size:14px; color:var(--curd);
    opacity:0; transform:translateY(0px);
  }
  .flash.show{ animation: floatUp 1.1s ease-out forwards; }
  @keyframes floatUp{
    0%{opacity:0; transform:translateY(6px);}
    15%{opacity:1; transform:translateY(0px);}
    75%{opacity:1;}
    100%{opacity:0; transform:translateY(-14px);}
  }

  /* --- camera viewport --- */
  .cam-wrap{
    margin:6px 18px 10px;
    border-radius:14px;
    overflow:hidden;
    background:#000;
    border:1px solid var(--line);
    position:relative;
    aspect-ratio: 4/3;
  }
  video{width:100%;height:100%;object-fit:cover;display:block;}
  .cam-frame{
    position:absolute; inset:14%;
    border:2px solid rgba(227,178,60,.75);
    border-radius:10px;
    pointer-events:none;
  }
  .cam-status{
    position:absolute; left:0; right:0; bottom:0;
    padding:8px 10px; font-size:11px; text-align:center;
    background:linear-gradient(0deg, rgba(0,0,0,.65), transparent);
    color:var(--paper); font-family:var(--mono);
  }
  .cam-off{
    display:flex; align-items:center; justify-content:center;
    height:100%; color:var(--muted); font-size:13px; text-align:center; padding:20px;
  }
  .candidate-badge{
    position:absolute; left:0; right:0; top:10px;
    display:flex; justify-content:center; pointer-events:none;
  }
  .candidate-badge span{
    background:rgba(10,14,22,.82); border:1px solid rgba(227,178,60,.55);
    color:var(--gold); font-family:var(--mono); font-size:12.5px;
    padding:5px 12px; border-radius:999px; opacity:0; transition:opacity .15s ease;
  }
  .candidate-badge span.on{opacity:1;}
  .shutter-wrap{
    position:absolute; left:0; right:0; bottom:34px;
    display:flex; justify-content:center; pointer-events:none;
  }
  #btnCapture{
    pointer-events:auto;
    width:66px; height:66px; border-radius:50%;
    background:var(--gold); border:4px solid rgba(255,255,255,.85);
    box-shadow:0 3px 14px rgba(0,0,0,.5);
    font-size:0;
  }
  #btnCapture:active{ transform:scale(.93); }
  #btnCapture.disabled{ background:var(--muted); pointer-events:none; opacity:.6; }

  .manual{
    margin:0 18px 8px; display:flex; gap:8px;
  }
  .manual input{
    flex:1; background:var(--panel); border:1px solid var(--line); color:var(--paper);
    border-radius:10px; padding:10px 12px; font-family:var(--mono); font-size:14px;
  }
  .manual button{
    background:var(--gold); border:none; color:#1B1502; font-weight:700;
    border-radius:10px; padding:0 16px; font-size:13px;
  }

  main{flex:1; overflow-y:auto; padding:4px 18px 12px;}
  .list-title{
    font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
    margin:10px 2px 6px; display:flex; justify-content:space-between;
  }
  ul#log{list-style:none; margin:0; padding:0;}
  ul#log li{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:10px 12px; margin-bottom:7px;
  }
  ul#log li .code{font-family:var(--mono); font-size:12.5px; color:var(--muted);}
  ul#log li .w{font-family:var(--mono); font-size:15px; font-weight:600; color:var(--paper);}
  ul#log li button{
    background:none; border:none; color:var(--danger); font-size:18px; padding:0 4px;
  }
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:24px 10px;}

  footer{
    display:flex; gap:10px; padding:12px 18px 18px;
    border-top:1px solid var(--line);
  }
  footer button{
    flex:1; padding:13px 0; border-radius:12px; border:none; font-weight:700; font-size:14px;
  }
  #btnScan{background:var(--curd); color:#08150F;}
  #btnScan.active{background:var(--danger); color:#1A0705;}
  #btnUndo{background:var(--panel); color:var(--paper); border:1px solid var(--line);}
  #btnReset{background:var(--panel); color:var(--danger); border:1px solid var(--line);}

  /* settings modal */
  dialog{
    border:none; border-radius:14px; padding:0; width:min(340px, 92vw);
    background:var(--panel); color:var(--paper); font-family:var(--sans);
  }
  dialog::backdrop{background:rgba(0,0,0,.55);}
  .dlg-body{padding:18px;}
  .dlg-body h2{font-size:14px; letter-spacing:.08em; text-transform:uppercase; color:var(--gold); margin:0 0 14px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:11px; color:var(--muted); margin-bottom:4px;}
  .field input{
    width:100%; background:var(--ink-2); border:1px solid var(--line); color:var(--paper);
    border-radius:8px; padding:8px 10px; font-family:var(--mono); font-size:13px;
  }
  .dlg-actions{display:flex; gap:8px; margin-top:16px;}
  .dlg-actions button{flex:1; padding:10px; border-radius:9px; border:none; font-weight:700;}
  .dlg-actions .save{background:var(--gold); color:#1B1502;}
  .dlg-actions .cancel{background:var(--ink-2); color:var(--paper); border:1px solid var(--line);}
</style>
</head>
<body>

<header>
  <div>
    <h1>PesoScan</h1>
    <div class="sub">somma pesi da codici EAN</div>
  </div>
  <button id="gear" title="Impostazioni">&#9881;</button>
</header>

<div class="readout">
  <div class="label">Totale</div>
  <div class="value" id="total">0<small>,000 kg</small></div>
  <div class="count" id="countLabel">0 letture</div>
  <div class="flash" id="flash"></div>
</div>

<div class="cam-wrap">
  <video id="video" playsinline muted></video>
  <div class="cam-frame" id="camFrame" style="display:none;"></div>
  <div class="candidate-badge"><span id="candidateBadge"></span></div>
  <div class="shutter-wrap" id="shutterWrap" style="display:none;">
    <button id="btnCapture" title="Cattura">Cattura</button>
  </div>
  <div class="cam-status" id="camStatus"></div>
  <div class="cam-off" id="camOff">Fotocamera non avviata.<br>Tocca "Avvia scansione" qui sotto.</div>
</div>

<div class="manual">
  <input id="manualInput" inputmode="numeric" placeholder="Inserisci codice EAN manualmente">
  <button id="manualAdd">Aggiungi</button>
</div>

<main>
  <div class="list-title"><span>Letture</span><span id="listCount">0</span></div>
  <ul id="log"></ul>
  <div class="empty" id="emptyMsg">Nessuna lettura ancora.</div>
</main>

<footer>
  <button id="btnScan">Avvia scansione</button>
  <button id="btnUndo">Annulla ultima</button>
  <button id="btnReset">Azzera</button>
</footer>

<dialog id="settingsDlg">
  <div class="dlg-body">
    <h2>Impostazioni formato EAN</h2>
    <div class="field">
      <label>Posizione iniziale campo peso (1-based)</label>
      <input type="number" id="cfgStart" min="1" max="13">
    </div>
    <div class="field">
      <label>Lunghezza campo peso (cifre)</label>
      <input type="number" id="cfgLen" min="1" max="8">
    </div>
    <div class="field">
      <label>Divisore (grammi per unità, es. 1000 = kg)</label>
      <input type="number" id="cfgDiv" min="1">
    </div>
    <div class="field">
      <label>Blocco tra due catture consecutive (ms)</label>
      <input type="number" id="cfgCooldown" min="0" step="100">
    </div>
    <div class="dlg-actions">
      <button class="cancel" id="cfgCancel">Annulla</button>
      <button class="save" id="cfgSave">Salva</button>
    </div>
  </div>
</dialog>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "pesoscan_state_v1";
  var CFG_KEY = "pesoscan_cfg_v1";

  var defaultCfg = { start: 8, len: 5, div: 1000, cooldown: 500 };
  var cfg = loadCfg();
  var state = loadState(); // { items: [{code, weightKg, ts}], lastCodeTs: {} }

  var totalEl = document.getElementById('total');
  var countLabel = document.getElementById('countLabel');
  var listCount = document.getElementById('listCount');
  var logEl = document.getElementById('log');
  var emptyMsg = document.getElementById('emptyMsg');
  var flashEl = document.getElementById('flash');
  var video = document.getElementById('video');
  var camFrame = document.getElementById('camFrame');
  var camStatus = document.getElementById('camStatus');
  var camOff = document.getElementById('camOff');
  var btnScan = document.getElementById('btnScan');
  var btnUndo = document.getElementById('btnUndo');
  var btnReset = document.getElementById('btnReset');
  var manualInput = document.getElementById('manualInput');
  var manualAdd = document.getElementById('manualAdd');
  var gear = document.getElementById('gear');
  var dlg = document.getElementById('settingsDlg');
  var candidateBadge = document.getElementById('candidateBadge');
  var shutterWrap = document.getElementById('shutterWrap');
  var btnCapture = document.getElementById('btnCapture');

  var stream = null;
  var detector = null;
  var scanning = false;
  var rafId = null;
  var cropCanvas = document.createElement('canvas');
  var cropCtx = cropCanvas.getContext('2d', { willReadFrequently: true });
  var candidate = null; // { code, ts }
  var lastCaptureTs = 0;

  function loadCfg(){
    try{
      var raw = localStorage.getItem(CFG_KEY);
      if(raw) return Object.assign({}, defaultCfg, JSON.parse(raw));
    }catch(e){}
    return Object.assign({}, defaultCfg);
  }
  function saveCfg(){
    localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
  }
  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return { items: [] };
  }
  function saveState(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function fmtKg(n){
    return n.toLocaleString('it-IT', {minimumFractionDigits:3, maximumFractionDigits:3});
  }

  function render(){
    var total = state.items.reduce(function(s,it){return s+it.weightKg;},0);
    var parts = fmtKg(total).split(',');
    totalEl.innerHTML = parts[0] + '<small>,' + parts[1] + ' kg</small>';
    countLabel.textContent = state.items.length + (state.items.length===1?' lettura':' letture');
    listCount.textContent = state.items.length;

    logEl.innerHTML = '';
    if(state.items.length===0){
      emptyMsg.style.display = 'block';
    } else {
      emptyMsg.style.display = 'none';
      // most recent first
      for(var i=state.items.length-1;i>=0;i--){
        (function(it, idx){
          var li = document.createElement('li');
          var left = document.createElement('div');
          left.innerHTML = '<div class="w">' + fmtKg(it.weightKg) + ' kg</div><div class="code">' + it.code + '</div>';
          var del = document.createElement('button');
          del.textContent = '\u00D7';
          del.onclick = function(){
            state.items.splice(idx,1);
            saveState();
            render();
          };
          li.appendChild(left);
          li.appendChild(del);
          logEl.appendChild(li);
        })(state.items[i], i);
      }
    }
  }

  function flashAdd(weightKg){
    flashEl.textContent = '+' + fmtKg(weightKg) + ' kg';
    flashEl.classList.remove('show');
    void flashEl.offsetWidth; // reflow to restart animation
    flashEl.classList.add('show');
  }

  function parseWeight(code){
    if(!/^\d{8,14}$/.test(code)) return null;
    var start = cfg.start - 1;
    var len = cfg.len;
    if(start < 0 || start + len > code.length) return null;
    var digits = code.substring(start, start+len);
    var grams = parseInt(digits, 10);
    if(isNaN(grams)) return null;
    return grams / cfg.div;
  }

  function tryAddCode(code){
    code = String(code).trim();
    var now = Date.now();
    var w = parseWeight(code);
    if(w === null || w <= 0){
      camStatus.textContent = 'Codice non valido: ' + code;
      return false;
    }
    state.items.push({ code: code, weightKg: w, ts: now });
    saveState();
    render();
    flashAdd(w);
    if(navigator.vibrate) navigator.vibrate(60);
    camStatus.textContent = 'Aggiunto ' + fmtKg(w) + ' kg  \u2022  ' + code;
    return true;
  }

  // ---- camera / detection ----
  function supportsDetector(){
    return 'BarcodeDetector' in window;
  }

  async function startScan(){
    if(!supportsDetector()){
      camStatus.textContent = 'BarcodeDetector non supportato su questo browser. Usa l\'inserimento manuale, oppure apri con Chrome su Android.';
      return;
    }
    try{
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width:{ideal:1280}, height:{ideal:960} },
        audio: false
      });
    }catch(err){
      camStatus.textContent = 'Impossibile accedere alla fotocamera (' + err.message + '). Serve HTTPS o localhost.';
      return;
    }
    video.srcObject = stream;
    await video.play();
    camOff.style.display = 'none';
    camFrame.style.display = 'block';
    shutterWrap.style.display = 'flex';
    detector = new BarcodeDetector({ formats: ['ean_13','ean_8','upc_a','upc_e','code_128'] });
    scanning = true;
    btnScan.textContent = 'Ferma scansione';
    btnScan.classList.add('active');
    camStatus.textContent = 'Inquadra il codice nel riquadro, poi tocca Cattura';
    loop();
  }

  function stopScan(){
    scanning = false;
    if(rafId) cancelAnimationFrame(rafId);
    if(stream){ stream.getTracks().forEach(function(t){t.stop();}); stream = null; }
    video.srcObject = null;
    camOff.style.display = 'flex';
    camFrame.style.display = 'none';
    shutterWrap.style.display = 'none';
    btnScan.textContent = 'Avvia scansione';
    btnScan.classList.remove('active');
    camStatus.textContent = '';
    candidate = null;
    candidateBadge.classList.remove('on');
  }

  // The visual guide box insets the video by 14% on every side (see .cam-frame).
  // We crop detection to that same region so codes outside the frame (e.g. the
  // barcode on the layer below) are never picked up.
  var GUIDE_INSET = 0.14;

  function cropToGuide(){
    var vw = video.videoWidth, vh = video.videoHeight;
    if(!vw || !vh) return null;
    var x = Math.round(vw * GUIDE_INSET);
    var y = Math.round(vh * GUIDE_INSET);
    var w = Math.round(vw * (1 - 2*GUIDE_INSET));
    var h = Math.round(vh * (1 - 2*GUIDE_INSET));
    cropCanvas.width = w;
    cropCanvas.height = h;
    cropCtx.drawImage(video, x, y, w, h, 0, 0, w, h);
    return cropCanvas;
  }

  var busy = false;
  async function loop(){
    if(!scanning) return;
    if(!busy && video.readyState >= 2){
      busy = true;
      try{
        var frame = cropToGuide();
        if(frame){
          var codes = await detector.detect(frame);
          if(codes && codes.length){
            candidate = { code: codes[0].rawValue, ts: Date.now() };
            var w = parseWeight(candidate.code);
            candidateBadge.textContent = candidate.code + (w!==null ? ('  \u2192 ' + fmtKg(w) + ' kg') : '  (formato non valido)');
            candidateBadge.classList.add('on');
          } else if(candidate && (Date.now() - candidate.ts) > 500){
            candidateBadge.classList.remove('on');
          }
        }
      }catch(e){ /* ignore transient detection errors */ }
      busy = false;
    }
    rafId = requestAnimationFrame(loop);
  }

  btnScan.addEventListener('click', function(){
    if(scanning) stopScan(); else startScan();
  });

  btnCapture.addEventListener('click', function(){
    var now = Date.now();
    if(now - lastCaptureTs < cfg.cooldown) return;
    if(!candidate || (now - candidate.ts) > 900){
      camStatus.textContent = 'Nessun codice nel riquadro: avvicina o centra meglio.';
      return;
    }
    lastCaptureTs = now;
    var added = tryAddCode(candidate.code);
    if(added){
      btnCapture.classList.add('disabled');
      setTimeout(function(){ btnCapture.classList.remove('disabled'); }, Math.max(250, cfg.cooldown));
    }
  });

  btnUndo.addEventListener('click', function(){
    if(state.items.length===0) return;
    state.items.pop();
    saveState();
    render();
  });

  btnReset.addEventListener('click', function(){
    if(state.items.length===0) return;
    if(confirm('Azzerare tutte le letture e il totale?')){
      state.items = [];
      saveState();
      render();
    }
  });

  manualAdd.addEventListener('click', function(){
    var v = manualInput.value.trim();
    if(!v) return;
    tryAddCode(v);
    manualInput.value = '';
    manualInput.focus();
  });
  manualInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter') manualAdd.click();
  });

  gear.addEventListener('click', function(){
    document.getElementById('cfgStart').value = cfg.start;
    document.getElementById('cfgLen').value = cfg.len;
    document.getElementById('cfgDiv').value = cfg.div;
    document.getElementById('cfgCooldown').value = cfg.cooldown;
    dlg.showModal();
  });
  document.getElementById('cfgCancel').addEventListener('click', function(){ dlg.close(); });
  document.getElementById('cfgSave').addEventListener('click', function(){
    cfg.start = parseInt(document.getElementById('cfgStart').value,10) || defaultCfg.start;
    cfg.len = parseInt(document.getElementById('cfgLen').value,10) || defaultCfg.len;
    cfg.div = parseInt(document.getElementById('cfgDiv').value,10) || defaultCfg.div;
    cfg.cooldown = parseInt(document.getElementById('cfgCooldown').value,10);
    if(isNaN(cfg.cooldown)) cfg.cooldown = defaultCfg.cooldown;
    saveCfg();
    dlg.close();
  });

  render();
})();
</script>
</body>
</html>
